name: Build and deploy Node.js app to Azure Web App - quin-msft-bingfc-frontend

on:
  push:
    branches:
      - frontend
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read  # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install, build, and test
        run: |
          npm install --force
          npm run build:prod 
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/  

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: dist
      
      - name: Move built files to wwwroot
        run: |
          mkdir -p wwwroot
          mv dist/* wwwroot/
      
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'quin-msft-bingfc-frontend'
          slot-name: 'Production'
          package: wwwroot/  
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_9766BFB79BB54225A94AFC843E83B752 }}
